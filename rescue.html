<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数据体检 · 传讯</title>
<style>
    body { margin: 0; padding: 14px; font-family: -apple-system, "PingFang SC", sans-serif; background: #f6f4f2; color: #333; font-size: 14px; line-height: 1.6; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .card h3 { font-size: 14px; margin: 0 0 8px; color: #c0788a; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12.5px; background: #faf8f6; padding: 10px; border-radius: 8px; margin: 6px 0 0; }
    button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #d99ba8; color: #fff; font-size: 15px; font-weight: 600; margin-top: 10px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 26vh; font-size: 11px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; margin-top: 8px; }
</style>
</head>
<body>
<h2>数据体检</h2>
<div class="card">
    <h3>本页只读，不会改动任何数据</h3>
    <div style="font-size:12.5px;color:#888">同时检查两个地方：① 浏览器数据库 localforage（App 主存储）② localStorage 镜像。哪边有数据，就列出你的头像/背景/字卡/皮肤数量。</div>
</div>
<div class="card">
    <h3>① 浏览器数据库 localforage</h3>
    <pre id="idb1">读取中…</pre>
</div>
<div class="card">
    <h3>② localStorage 镜像</h3>
    <pre id="idb2">读取中…</pre>
</div>
<div class="card">
    <h3>③ 其它数据库（干净版建的）</h3>
    <pre id="idb3">读取中…</pre>
</div>
<div class="card">
    <h3>④ 备份</h3>
    <button id="dl">下载完整备份（JSON）</button>
    <button id="show">在页面显示备份内容</button>
    <textarea id="ta" placeholder="点上面的按钮后，内容会出现在这里"></textarea>
</div>
<script>
(function () {
    var KEY = 'CHAT_APP_V13_appData';
    var dump = { at: new Date().toISOString(), localStorage: {}, indexedDB: {} };
    function fmt(n) { return n > 1048576 ? (n / 1048576).toFixed(2) + ' MB' : n > 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B'; }
    function num(v) { return (v && v.length) ? v.length : 0; }

    function summarize(raw) {
        var out = [], o = null;
        try { o = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return '  (无法解析)'; }
        if (!o || typeof o !== 'object') return '  (空)';
        var fd = o.featureData || {}, s = o.settings || {};
        out.push('消息：' + num(o.messages) + ' 条');
        out.push('昵称：' + (s.myName || '?') + ' & ' + (s.partnerName || '?'));
        out.push('皮肤/主题：' + (s.colorTheme || s.theme || '(无)') + (s.isDarkMode ? ' 深色' : ''));
        out.push('聊天背景：' + (s.chatBgImage ? fmt(String(s.chatBgImage).length) : '(无)'));
        var al = fd.avatarLib || {};
        out.push('头像库：我 ' + num(al.mine) + ' 张 / 梦角 ' + num(al.partner) + ' 张');
        out.push('当前头像：我 ' + (al.currentMine ? '✓' : '✗') + ' / 梦角 ' + (al.currentPartner ? '✓' : '✗'));
        out.push('主页背景：' + (fd.homePageBg && fd.homePageBg.image ? fmt(String(fd.homePageBg.image).length) : '(无)'));
        out.push('你我之间背景：' + (fd.togetherBg && fd.togetherBg.image ? '有' : '(无)'));
        out.push('朋友圈：' + num(fd.momentPosts) + ' 条');
        out.push('商城商品：' + num(fd.shop && fd.shop.products));
        out.push('状态字卡库：' + num(o.statusReplies) + ' 条');
        out.push('表情库：' + num(o.stickerLibrary) + ' / 我的 ' + num(o.myStickerLibrary));
        out.push('问卷：' + num(fd.surveys));
        out.push('恋爱日记：' + (fd.loveDiary ? ('有（纪念日 ' + num(fd.loveDiary.anniversaries) + '）') : '(无)'));
        out.push('保存时间：' + (o.savedAt ? new Date(o.savedAt).toLocaleString() : '(无)'));
        return out.join('\n');
    }

    var lsRaw = null;
    try { lsRaw = window.localStorage.getItem(KEY); } catch (e) {}
    if (lsRaw) {
        dump.localStorage[KEY] = lsRaw;
        document.getElementById('idb2').textContent = '大小：' + fmt(lsRaw.length) + '\n' + summarize(lsRaw);
    } else {
        document.getElementById('idb2').textContent = '(空 —— localStorage 里没有这份数据)';
    }

    function openDb(name, version) {
        return new Promise(function (res) {
            var rq;
            try { rq = version ? indexedDB.open(name, version) : indexedDB.open(name); } catch (e) { res(null); return; }
            rq.onsuccess = function () { res(rq.result); };
            rq.onerror = function () { res(null); };
            rq.onblocked = function () { res(null); };
        });
    }
    function getAll(store) {
        return new Promise(function (res) {
            try {
                var rq = store.getAll();
                rq.onsuccess = function () { res(rq.result || []); };
                rq.onerror = function () { res([]); };
            } catch (e) { res([]); }
        });
    }

    var idbLines = [], otherLines = [];
    Promise.resolve()
        .then(function () {
            // 先列出所有数据库（关键：数据可能在别的库里）
            return new Promise(function (res) {
                try {
                    if (indexedDB.databases) {
                        indexedDB.databases().then(function (list) {
                            idbLines.push('=== 全部数据库 ===');
                            (list || []).forEach(function (d) { idbLines.push('  · ' + d.name + (d.version ? (' v' + d.version) : '')); });
                            if (!list || !list.length) idbLines.push('  （一个都没有）');
                            idbLines.push('==================');
                            res();
                        }, function () { res(); });
                    } else { idbLines.push('（此浏览器不支持枚举数据库）'); res(); }
                } catch (e) { res(); }
            });
        })
        .then(function () {
            // 逐个库统计记录数，找出哪个库里有 CHAT_APP_V13_appData
            return new Promise(function (res) {
                var names = ['localforage', 'chat_app_db', 'chat_app_kv', 'CHAT_APP_V13', 'chat_app_shim', 'appdata', 'chatAppDb'];
                var chain = Promise.resolve();
                idbLines.push('=== 逐个库检查 ===');
                names.forEach(function (nm) {
                    chain = chain.then(function () {
                        return openDb(nm).then(function (db) {
                            if (!db) return;
                            var sts = Array.prototype.slice.call(db.objectStoreNames);
                            if (!sts.length) { idbLines.push('  ' + nm + '：存在但没有表'); try { db.close(); } catch (e) {} return; }
                            idbLines.push('  ' + nm + '：表 ' + sts.join(', '));
                            var c2 = Promise.resolve();
                            sts.forEach(function (st) {
                                c2 = c2.then(function () {
                                    var tx, store;
                                    try { tx = db.transaction(st, 'readonly'); store = tx.objectStore(st); } catch (e) { return; }
                                    return getAll(store).then(function (arr) {
                                        idbLines.push('     └ ' + st + '：' + arr.length + ' 条');
                                        arr.forEach(function (rec) {
                                            var k = rec && rec.key;
                                            if (k) {
                                                idbLines.push('        · key=' + k + ' 大小=' + fmt(typeof rec.value === 'string' ? rec.value.length : JSON.stringify(rec.value || '').length));
                                                dump.indexedDB[nm + '.' + st] = dump.indexedDB[nm + '.' + st] || {};
                                                dump.indexedDB[nm + '.' + st][k] = rec.value;
                                                if (String(k).indexOf('appData') >= 0) {
                                                    idbLines.push('        ▸ 摘要：\n' + summarize(rec.value).replace(/\n/g, '\n          '));
                                                }
                                            }
                                        });
                                    });
                                });
                            });
                            return c2.then(function () { try { db.close(); } catch (e) {} });
                        });
                    });
                });
                return chain.then(res);
            });
        })
        .then(function () { return openDb('localforage'); })
        .then(function (db) {
            if (!db) { idbLines.push('库 localforage：不存在或打不开'); return; }
            var names = Array.prototype.slice.call(db.objectStoreNames);
            idbLines.push('库 localforage 的表：' + (names.join(', ') || '(无)'));
            var chain = Promise.resolve();
            names.forEach(function (n) {
                chain = chain.then(function () {
                    var tx, store;
                    try { tx = db.transaction(n, 'readonly'); store = tx.objectStore(n); } catch (e) { return; }
                    return getAll(store).then(function (arr) {
                        idbLines.push('  表 ' + n + '：' + arr.length + ' 条记录');
                        arr.forEach(function (rec) {
                            var k = rec && rec.key, v = rec && rec.value;
                            if (!k) return;
                            dump.indexedDB['localforage.' + n] = dump.indexedDB['localforage.' + n] || {};
                            dump.indexedDB['localforage.' + n][k] = v;
                            idbLines.push('    ├ ' + k + '：' + fmt(typeof v === 'string' ? v.length : JSON.stringify(v || '').length));
                            if (k === KEY) idbLines.push('    └ 摘要：\n' + summarize(v).replace(/\n/g, '\n      '));
                        });
                    });
                });
            });
            return chain.then(function () { try { db.close(); } catch (e) {} });
        })
        .then(function () { return openDb('chat_app_db'); })
        .then(function (db) {
            if (!db) { otherLines.push('库 chat_app_db：不存在'); return; }
            var names = Array.prototype.slice.call(db.objectStoreNames);
            otherLines.push('库 chat_app_db 的表：' + names.join(', '));
            var chain = Promise.resolve();
            names.forEach(function (n) {
                chain = chain.then(function () {
                    var tx, store;
                    try { tx = db.transaction(n, 'readonly'); store = tx.objectStore(n); } catch (e) { return; }
                    return getAll(store).then(function (arr) {
                        otherLines.push('  表 ' + n + '：' + arr.length + ' 条记录');
                        dump.indexedDB['chat_app_db.' + n] = arr;
                        arr.forEach(function (rec) {
                            if (rec && rec.key === KEY) otherLines.push('    └ 发现 ' + KEY + ' 摘要：\n' + summarize(rec.value).replace(/\n/g, '\n      '));
                        });
                    });
                });
            });
            return chain.then(function () { try { db.close(); } catch (e) {} });
        })
        .then(function () {
            document.getElementById('idb1').textContent = idbLines.join('\n') || '(无)';
            document.getElementById('idb3').textContent = otherLines.join('\n') || '(无)';
        })
        .catch(function (e) { document.getElementById('idb1').textContent = '读取失败：' + e; });

    document.getElementById('dl').addEventListener('click', function () {
        try {
            var s = JSON.stringify(dump);
            var blob = new Blob([s], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'chuanxun-rescue-' + Date.now() + '.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        } catch (e) { alert('下载失败：' + e); }
    });
    document.getElementById('show').addEventListener('click', function () {
        document.getElementById('ta').value = JSON.stringify(dump);
    });
})();
</script>
</body>
</html>
